async function jobDone(j){
  await refreshSteamcmd();
  if(j.kind==="download"||j.kind==="copy"){
    if(j.kind==="download"&&(j.ok||[]).length){ W.list=W.list.filter(x=>!j.ok.includes(x.id)); await saveList(); }
    W.results.forEach(x=>{ if((j.ok||[]).includes(x.id)) x.inPackage=true; });
    await mergeScan();
    const moved=adoptLocal(j.ok||[]);
    if(W.check) for(const id of j.ok||[]){ if(W.check.details[id]) W.check.details[id]=Object.assign({},W.check.details[id]); }
    render();
    const tail=j.error?(" · "+j.error):"";
    toast((j.summary||"Finished")+tail,!!j.error&&!(j.ok||[]).length);
    const still=(j.ok||[]).filter(isSubscribed);
    if(still.length) unsubscribeDialog(still,moved);
  }else if(j.kind==="login"){
    toast(j.error?j.error:(j.summary||"Logged in"),!!j.error);
  }else if(j.kind==="install"){
    toast(j.error?("SteamCMD install failed: "+j.error):(j.summary||"SteamCMD installed"),!!j.error);
  }
  if(S.view==="ws") renderWs();
}

/* Re-read the folders without throwing away unsaved changes to the load order. */
async function mergeScan(){
  const {ok,data}=await api("/api/state"); if(!ok) return false;
  const fresh=new Map(data.rows.map(r=>[r.path.toLowerCase(),r]));
  const rows=[];
  for(const r of S.rows){
    const f=fresh.get(r.path.toLowerCase());
    if(f){ Object.assign(r,{meta:f.meta,hasPreview:f.hasPreview,missing:f.missing,updatedAt:f.updatedAt,
             workshopId:f.workshopId,source:f.source,localCopy:f.localCopy,folder:f.folder}); fresh.delete(r.path.toLowerCase()); }
    else r.missing=true;
    rows.push(r);
  }
  for(const f of fresh.values()){ f.enabled=false; f.isNew=true; rows.push(f); }
  S.rows=rows; S.steamcmd=data.steamcmd||S.steamcmd;
  const c=new Map(); for(const r of S.rows){ const id=r.meta&&r.meta.id; if(id) c.set(id,(c.get(id)||0)+1); }
  for(const r of S.rows){ const id=r.meta&&r.meta.id; r.dup=!!(id&&c.get(id)>1); }
  normalize(); return true;
}
/* A mod now in Package takes over its Workshop twin's slot and on/off state; the Workshop
   copy is switched off and sinks. The file only changes when you save. */
function adoptLocal(ids){
  let moved=0;
  for(const id of ids){
    const ws=S.rows.find(r=>r.source==="workshop"&&r.workshopId===id);
    const loc=S.rows.find(r=>r.source==="local"&&r.workshopId===id);
    if(!ws||!loc||ws===loc) continue;
    if(!moved) pushUndo();
    const on=ws.enabled, rest=S.rows.filter(r=>r!==loc);
    rest.splice(rest.indexOf(ws),0,loc);
    loc.enabled=on; loc.isNew=false; ws.enabled=false;
    S.rows=rest; normalize(); moved++;
  }
  if(moved) dirty();
  return moved;
}

    p.appendChild(g);

  if(upd.length){
    const g=el("div","group"); g.appendChild(el("h4",null,`Updates for your Package mods (${upd.length})`));

      row.append(cb,tt,el("div","m")); t.appendChild(row);

    go.onclick=()=>{ const ids=upd.filter(id=>!W.updSel.has("x"+id)); if(ids.length) startDownload(ids); };
    go.disabled=!(S.steamcmd&&S.steamcmd.loggedIn)||(W.job&&W.job.running);
    r2.appendChild(go); g.appendChild(r2); p.appendChild(g);

  if(subs.length) p.appendChild(keepAll(subs));

}

function tagFilter(t){
  document.querySelectorAll('.scrim.detailScrim').forEach(s=>s.remove());
  const tags=W.tags.includes(t)?W.tags:W.tags.concat(t);
  if(W.sub!=="browse"){ W.sub="browse"; W.tags=tags; renderWs(); runSearch(); } else searchFrom({tags});
}
function paintBrowse(){
  const res=$("#wsResults"); if(!res) return;
  res.innerHTML="";
  const head=el("div","resHead");
  if(W.loading&&!W.results.length) head.appendChild(el("span",null,"Searching…"));
  else if(W.searched) head.appendChild(el("span",null,`${W.total.toLocaleString()} mod${W.total===1?"":"s"}`+(W.q?` matching "${W.q}"`:"")));
  if(W.hiddenMature) head.appendChild(el("span","hint",`· ${W.hiddenMature} mature item${W.hiddenMature===1?"":"s"} hidden (Setup)`));
  res.appendChild(head);
  const grid=el("div","cards");
  for(const it of W.results) grid.appendChild(buildCard(it));
  res.appendChild(grid);
  if(W.searched&&!W.results.length&&!W.loading) res.appendChild(el("p","empty","Nothing found."));
  if(W.results.length&&W.results.length<W.total){
    const lm=el("div","loadMore"), b=el("button",null,W.loading?"Loading…":"Load more"); b.disabled=W.loading;
    b.onclick=()=>runSearch(true); lm.appendChild(b); res.appendChild(lm);
  }
}
function buildCard(it){
  const c=el("div","card");
  const img=el("div","img"); if(it.preview) img.style.backgroundImage=`url("${it.preview.replace(/"/g,"%22")}")`;
  const badges=el("div","badges");
  if(it.inPackage) badges.appendChild(el("span","pk","In Package"));
  else if(it.subscribed) badges.appendChild(el("span",null,"Subscribed"));
  if(it.requires&&it.requires.length) badges.appendChild(el("span","rq",`Needs ${it.requires.length} more`));
  img.appendChild(badges); img.onclick=()=>detailDialog(it.id);
  const b=el("div","body");
  const t=el("div","ttl",it.title); t.onclick=()=>detailDialog(it.id); b.appendChild(t);
  if(it.author) b.appendChild(el("div","by","by "+it.author));
  const st=el("div","stats");
  if(it.up+it.down>0) st.appendChild(el("span",it.score>=.8?"good":null,Math.round(it.score*100)+"% 👍"));
  st.appendChild(el("span",null,fmtCount(it.subs)+" subs"));
  if(it.size) st.appendChild(el("span",null,fmtMB(it.size)));
  b.appendChild(st);
  b.appendChild(addBtn(it));
  c.append(img,b); return c;
}
async function detailDialog(id){
  const scrim=el("div","scrim detailScrim"), m=el("div","modal detail");
  m.appendChild(el("p",null,"Loading…")); m.firstChild.style.padding="20px";
  scrim.appendChild(m); document.body.appendChild(scrim);
  scrim.onclick=e=>{ if(e.target===scrim) scrim.remove(); };
  const {ok,status,data:it}=await api("/api/workshop/item",{method:"POST",body:{id}});
  if(!ok){ m.firstChild.textContent=status===401?"Steam rejected the API key.":(it.error||"Couldn't load that mod."); return; }
  m.innerHTML="";
  const top=el("div","top"), left=el("div"), side=el("div","side");
  const imgs=[it.preview].concat(it.shots||[]).filter(Boolean);
  const hero=document.createElement("img"); hero.className="hero"; hero.alt=""; if(imgs[0]) hero.src=imgs[0];
  left.appendChild(hero);
  if(imgs.length>1){
    const strip=el("div","shots");
    imgs.forEach((u,i)=>{ const th=document.createElement("img"); th.src=u; th.alt=""; if(!i) th.className="on";
      th.onclick=()=>{ hero.src=u; strip.querySelectorAll("img").forEach(x=>x.classList.remove("on")); th.classList.add("on"); };
      strip.appendChild(th); });
    left.appendChild(strip);
  }
  side.appendChild(el("h2",null,it.title));
  side.appendChild(el("div","by",it.author?"by "+it.author:""));
  const kv=el("dl","kv");
  const add=(k,v)=>{ if(v) { kv.append(el("dt",null,k),el("dd",null,v)); } };
  if(it.up+it.down>0) add("Rating",`${Math.round(it.score*100)}% (${fmtCount(it.up)} up, ${fmtCount(it.down)} down)`);
  add("Subscribers",fmtCount(it.subs)); add("Size",fmtMB(it.size));
  add("Updated",fmtDate(it.updated)); add("Posted",fmtDate(it.created));
  add("On your disk",it.inPackage?"In Package":it.subscribed?"Subscribed (Workshop folder)":"");
  side.appendChild(kv);
  if(it.tags&&it.tags.length){ const tg=el("div","tags"); it.tags.forEach(t=>{ const b=el("button",null,t); b.title="Show mods with this tag"; b.onclick=()=>tagFilter(t); tg.appendChild(b); }); side.appendChild(tg); }
  const bc=el("div","btnCol"); bc.appendChild(addBtn(it));
  const vb=el("button",null,"View on Steam (browser)"); vb.onclick=()=>window.open(workshopURL(it.id),"_blank","noopener");
  const vs=el("button",null,"Open in Steam"); vs.onclick=()=>api("/api/open-steam",{method:"POST",body:{id:it.id}});
  bc.append(vb,vs); side.appendChild(bc);
  top.append(left,side); m.appendChild(top);
  if(it.requiresInfo&&it.requiresInfo.length){
    const rq=el("div","reqs"); rq.appendChild(el("h4",null,`Needs ${it.requiresInfo.length} other mod${it.requiresInfo.length>1?"s":""}`));
    for(const r of it.requiresInfo){
      const row=el("div","reqRow");
      row.appendChild(el("span",null,(r.title||r.id)+(r.live?"":" — removed from the Workshop")));
      if(r.inPackage) row.appendChild(el("span","hint","in Package"));
      else if(r.subscribed) row.appendChild(el("span","hint","subscribed"));
      if(r.live){ const b=addBtn(r); b.style.width="auto"; row.appendChild(b); }
      rq.appendChild(row);
    }
    const missing=it.requiresInfo.filter(r=>r.live&&!r.inPackage&&!inList(r.id));
    if(missing.length){ const all=el("button","primary",`Add this and its ${missing.length} requirement${missing.length>1?"s":""}`);
      all.style.marginTop="8px"; all.onclick=()=>{ const n=addToList([it].concat(missing)); toast(`Added ${n} to the download list`); };
      rq.appendChild(all); }
    m.appendChild(rq);
  }
  m.appendChild(el("div","desc",it.desc||"No description."));
  const foot=el("div","foot"), cl=el("button",null,"Close"); cl.onclick=()=>scrim.remove(); foot.appendChild(cl); m.appendChild(foot);
}
function keyPanel(intro){
  const p=el("section","panel keyCard");
  p.appendChild(el("h3",null,"Steam Web API key",));
  if(intro) p.appendChild(el("p",null,"Browsing the Workshop uses Steam's official Workshop API, so it keeps working when Valve redesigns their site. Searching it needs a free key, once:"));
  if(!W.key.set||intro){
    const ol=el("ol");
    const li1=el("li"); li1.append("Open "); const a=document.createElement("a"); a.href="https://steamcommunity.com/dev/apikey"; a.target="_blank"; a.rel="noopener"; a.textContent="steamcommunity.com/dev/apikey"; li1.appendChild(a); li1.append(" and sign in.");
    ol.append(li1,el("li",null,"For the domain name, type anything — localhost is fine. Agree and register."),el("li",null,"Copy the key it shows and paste it here."));
    p.appendChild(ol);
  }
  p.appendChild(el("p","hint",W.key.set?`A key is saved (${W.key.hint}). Paste a new one to replace it.`:"The key is stored only in emmin_settings.json on your PC — don't share that file."));
  const r=el("div","btnRow");
  const i=document.createElement("input"); i.type="text"; i.className="mono"; i.placeholder="32-character key"; i.spellcheck=false;
  const s=el("button","primary","Save key");
  s.onclick=async()=>{ s.disabled=true; s.textContent="Checking…";
    const {ok,data}=await api("/api/workshop/key",{method:"POST",body:{key:i.value}});
    if(!ok){ toast(data.error,true); s.disabled=false; s.textContent="Save key"; return; }
    W.key.set=true; W.key.hint=data.hint; toast("Key works. Browsing is ready."); W.sub="browse"; renderWs(); runSearch(); };
  i.onkeydown=e=>{ if(e.key==="Enter") s.onclick(); };
  r.append(i,s); p.appendChild(r);
  if(!intro){
    const m=el("label","check"); m.style.marginTop="12px";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!W.key.mature;
    cb.onchange=async()=>{ await api("/api/workshop/key",{method:"POST",body:{mature:cb.checked}}); W.key.mature=cb.checked; W.results=[]; W.searched=false; };
    m.append(cb," Show mods Steam marks as mature"); p.appendChild(m);
  }
  return p;
}
function listPanel(){
  const p=el("section","panel"); p.id="wsList";
  return p;
}
function paintDlList(){
  const p=$("#wsList"); if(!p) return;
  p.innerHTML="";
  const total=W.list.reduce((a,x)=>a+(x.size||0),0);
  const h=el("h3",null,"Download list"); h.appendChild(el("span","hint",W.list.length?`· ${W.list.length} · ${fmtMB(total)||"?"}`:"· empty"));
  p.appendChild(h);
  const ta=document.createElement("textarea"); ta.className="paste"; ta.style.minHeight="44px"; ta.value=W.pasteText;
  ta.placeholder="Paste links, IDs or collection links"; ta.oninput=()=>W.pasteText=ta.value;
  p.appendChild(ta);
  const r=el("div","btnRow"); const ad=el("button",null,"Add");
  ad.onclick=async()=>{
    if(!W.pasteText.trim()) return;
    ad.disabled=true; ad.textContent="Looking up…";
    const {ok,data}=await api("/api/workshop/resolve",{method:"POST",body:{text:W.pasteText}});
    ad.disabled=false; ad.textContent="Add";
    if(!ok){ toast(data.error||"Lookup failed",true); return; }
    const good=data.items.filter(x=>x.result===1&&!x.banned&&!x.wrongGame);
    const n=addToList(good.map(x=>({id:x.id,title:x.title,size:x.file_size})));
    const bad=data.items.length-good.length, dupe=good.length-n;
    W.pasteText=""; paintDlList();
    toast(`Added ${n}`+(dupe?` · ${dupe} already listed`:"")+(bad?` · ${bad} skipped (removed or not an Elin mod)`:""),false);
  };
  r.appendChild(ad); p.appendChild(r);
  if(W.list.length){
    const ul=el("ul","listItems");
    for(const x of W.list){
      const li=el("li"), th=el("div","th"); if(x.preview) th.style.backgroundImage=`url("${x.preview.replace(/"/g,"%22")}")`;
      const nm=el("span","nm",x.title||x.id); nm.title=x.id;
      const sz=el("span","sz",fmtMB(x.size));
      const rm=el("button","x","×"); rm.title="Remove"; rm.onclick=()=>removeFromList(x.id);
      li.append(th,nm,sz,rm); ul.appendChild(li);
    }
    p.appendChild(ul);
    const sc=S.steamcmd||{}, busy=W.job&&W.job.running;
    const r2=el("div","btnRow");
    const go=el("button","primary",`Download ${W.list.length} into Package`); go.disabled=!sc.loggedIn||busy;
    go.onclick=()=>startDownload(W.list.map(x=>x.id));
    const cl=el("button",null,"Clear"); cl.onclick=()=>{ if(confirm("Empty the download list?")){ W.list=[]; saveList(); paintDlList(); syncAddButtons(); } };
    r2.append(go,cl); p.appendChild(r2);
    if(!sc.loggedIn) p.appendChild(el("p","hint","SteamCMD needs setting up and logging in first — see Setup."));
  }
}
function renderWs(){
  const root=$("#wsMain"); root.innerHTML="";
  root.style.cssText="display:block;padding:0;max-width:none";
  const nav=el("div","wsNav");
  const tabs=el("div","chips");
  const sc=S.steamcmd||{};
  [["browse","Browse"],["updates","Updates"],["setup","Setup"+(!sc.loggedIn||!W.key.set?" ⚠":"")]].forEach(([k,t])=>{
    const b=el("button",W.sub===k?"on":"",t); b.onclick=()=>{ W.sub=k; renderWs(); }; tabs.appendChild(b); });
  nav.appendChild(tabs); root.appendChild(nav);
  const body=el("div","wsBody"), left=el("div","wsCol"), right=el("div","wsSide");
  if(W.sub==="browse") left.appendChild(sectionBrowse());
  else if(W.sub==="updates") left.appendChild(panelUpdates());
  else { left.style.cssText="display:flex;flex-direction:column;gap:16px"; left.append(panelSteamcmd(),keyPanel(false)); }
  right.style.cssText="display:flex;flex-direction:column;gap:16px";
  right.appendChild(listPanel());
  const act=el("section","panel"); act.id="wsActivity"; right.appendChild(act);
  body.append(left,right); root.appendChild(body);
  paintDlList(); paintActivity(); paintBrowse();
}

/* ---------- keyboard ---------- */
addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(S.view==="ws"){ if(e.key==="Escape"&&typing) document.activeElement.blur(); return; }
  if(S.view==="cfg"){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); saveCfg(false); return; }
    if(e.key==="/"&&!typing){ e.preventDefault(); const q=$("#cfgSearch"); if(q) q.focus(); return; }
    if(e.key==="Escape"){ if(popEl) closePop(); else if(typing) document.activeElement.blur(); }
    return;                       // nothing else: the mod-list shortcuts mustn't fire in here
  }
  if(e.key==="/"&&!typing){e.preventDefault(); $("#search").focus(); return;}
  if(e.key==="Escape"){
    if(popEl)closePop();
    else if(document.activeElement===$("#search")){$("#search").value=""; S.query=""; $("#search").blur(); render();}
    else {S.sel.clear(); render();}
    return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault(); if(S.dirty)save(); return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault(); undo(); return;}
  if(typing) return;
  const sel=selected();
  if(e.key.toLowerCase()==="m"&&sel.length&&sel.every(r=>r.enabled)){e.preventDefault(); slotDialog(sel); return;}
  if(e.key==="Enter"&&sel.length){e.preventDefault(); relocate(sel,null,false,!sel[0].enabled); return;}
  const isOn=S.anchorPane==="on";
  const list=isOn?shownOn():shownOff();
  if(!list.length) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    const d=e.key==="ArrowDown"?1:-1;
    if(e.altKey&&sel.length&&sel.every(r=>r.enabled)){nudge(sel,d); return;}
    let i=list.findIndex(r=>r.path===S.anchor);
    i = i<0 ? 0 : Math.max(0,Math.min(list.length-1,i+d));
    const target=list[i];
    if(e.shiftKey) S.sel.add(target.path); else {S.sel.clear(); S.sel.add(target.path);}
    S.anchor=target.path; render();
    const n=$(`.row[data-path="${CSS.escape(target.path)}"]`); if(n) n.scrollIntoView({block:"nearest"});
  }
});
addEventListener("beforeunload",e=>{if(S.dirty||C.edits.size||(W.job&&W.job.running)){e.preventDefault(); e.returnValue="";}});

/* ---------- wire ---------- */
$("#btnSave").onclick=()=>save(false);
$("#btnRescan").onclick=async()=>{
  if(S.dirty&&!confirm("You have unsaved changes. Rescanning throws them away. Carry on?"))return;
  await loadState(); toast("Rescanned");
};
$("#btnLists").onclick=listsDialog;
$("#btnSort").onclick=sortByRules;
$("#btnFolders").onclick=foldersDialog;
$("#btnHelp").onclick=helpDialog;
$("#btnPlay").onclick=async()=>{
  if(S.dirty&&!confirm("You have unsaved changes — the game won't see them. Launch anyway?"))return;
  const {ok,data}=await api("/api/launch",{method:"POST",body:{}});
  toast(ok?"Told Steam to launch Elin":(data.error||"Couldn't launch"),!ok);
};
$("#btnQuit").onclick=async()=>{
  if((S.dirty||C.edits.size)&&!confirm("You have unsaved changes. Quit anyway?"))return;
  await api("/api/quit",{method:"POST",body:{}});
  document.body.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#8E95A5">Server stopped. You can close this tab.</div>';
};
$("#search").oninput=e=>{S.query=e.target.value; render();};
$("#tabMods").onclick=()=>showView("mods");
$("#tabCfg").onclick=()=>showView("cfg");
$("#tabWs").onclick=()=>showView("ws");
$("#cfgFileSearch").oninput=e=>{C.fq=e.target.value; renderCfgList();};
loadState();
</script>
